services:
  - type: web
    name: safe-csv-analyst-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: ""
